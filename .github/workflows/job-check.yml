name: 채용공고 알림 체크

on:
  schedule:
    # 하루 1번: 한국시간(KST, UTC+9) 오후 1시 = UTC 04:00
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 채용공고 체크
        run: |
          curl -s -X GET "https://diet-daily.vercel.app/api/cron/job-check" \
            -H "Accept: application/json" \
            -o response.json
          cat response.json
          echo ""
          echo "✅ 채용공고 체크 완료"
