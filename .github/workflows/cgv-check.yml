name: 30분 자동 체크 (CGV IMAX · 채용공고)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: CGV API 체크
        run: |
          curl -s -X GET "https://diet-daily.vercel.app/api/cron/cgv-check" \
            -H "Accept: application/json" \
            -o response.json
          cat response.json
          echo ""
          echo "✅ CGV 체크 완료"
      - name: 채용공고 체크
        run: |
          curl -s -X GET "https://diet-daily.vercel.app/api/cron/job-check" \
            -H "Accept: application/json" \
            -o job-response.json
          cat job-response.json
          echo ""
          echo "✅ 채용공고 체크 완료"
